<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Profile | Arvind Digital Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f4f6fb;
}

.profile-card{
    max-width:700px;
    margin:50px auto;
}

.profile-photo{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #0d6efd;
}

.info-label{
    font-weight:600;
    color:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow profile-card">

<div class="card-body p-4">

<div class="text-center mb-4">

<img
id="profilePhoto"
src="assets/images/user.png"
class="profile-photo"
alt="Profile">

<div class="mt-3">

<div class="info-label">

Name

</div>

<div id="profileName">

Loading...

</div>

</div>
<p class="text-muted" id="profileEmail">

Loading...

</p>

</div>

<hr>

<div class="row gy-3">

<div class="col-md-6">

<div class="info-label">Phone</div>

<div id="profilePhone">-</div>

</div>

<div class="col-md-6">

<div class="info-label">Company</div>

<div id="profileCompany">-</div>

</div>

<div class="col-md-6">

<div class="info-label">Designation</div>

<div id="profileDesignation">-</div>

</div>

<div class="col-md-6">

<div class="info-label">Member Since</div>

<div id="memberSince">-</div>

</div>

<div class="col-12">

<div class="info-label">About Me</div>

<div id="profileAbout">-</div>

</div>

</div>

<div class="text-center mt-4">

<button
class="btn btn-primary"
id="editProfileBtn">

<i class="bi bi-pencil-square"></i>

Edit Profile

</button>

<button
class="btn btn-success d-none"
id="saveProfileBtn">

<i class="bi bi-check-circle"></i>

Save

</button>

<button
class="btn btn-secondary d-none"
id="cancelProfileBtn">

Cancel

</button>

</div>

</div>

</div>

</div>

<script type="module" src="assets/js/profile.js"></script>

</body>

</html>
