<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>

Resources Library

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="assets/css/style.css">

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="fw-bold">

📚 Resources Library

</h2>

<a href="dashboard.html"
class="btn btn-outline-secondary">

Back

</a>

</div>

<div class="row mb-4">

<div class="col-md-6">

<input
type="text"
id="resourceSearch"
class="form-control"
placeholder="Search resources...">

</div>

<div class="col-md-3">

<select
id="categoryFilter"
class="form-select">

<option value="">

All Categories

</option>

</select>

</div>

<div class="col-md-3">

<select
id="sortResources"
class="form-select">

<option value="latest">

Latest First

</option>

<option value="oldest">

Oldest First

</option>

<option value="downloads">

Most Downloaded

</option>

<option value="title">

Title A-Z

</option>

</select>

</div>

</div>

<div
id="resourcesContainer"
class="row g-4">

<div class="text-center py-5">

<div class="spinner-border"></div>

</div>

</div>

  <!-- Resource Footer -->

<div class="row mt-4 align-items-center">

    <!-- Showing Results -->

    <div class="col-md-4 mb-3 mb-md-0">

        <small id="resourceInfo" class="text-muted">

            Showing 0–0 of 0 resources

        </small>

    </div>

    <!-- Page Size -->

    <div class="col-md-4 text-center mb-3 mb-md-0">

        <label class="me-2 fw-semibold">

            Show

        </label>

        <select id="pageSize" class="form-select d-inline-block w-auto">

            <option value="9" selected>9</option>

            <option value="18">18</option>

            <option value="36">36</option>

            <option value="72">72</option>

            <option value="100">100</option>

        </select>

    </div>

    <!-- Pagination -->

    <div class="col-md-4">

        <nav>

            <ul id="pagination" class="pagination justify-content-md-end justify-content-center mb-0">

            </ul>

        </nav>

    </div>

</div>

<div
id="pagination"
class="mt-5 d-flex justify-content-center">

</div>

</div>

<script type="module"
src="assets/js/library.js"></script>

</body>

</html>
