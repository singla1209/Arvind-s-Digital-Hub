<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Arvind Digital Hub</title>

<link rel="icon" href="assets/images/favicon.png">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/register.css">

</head>

<body>

<div class="register-wrapper">

<div class="register-card">

<img src="assets/images/logo.png"
class="logo"
alt="Logo">

<h2 class="brand">

Digital Hub

</h2>

<p class="subtitle">

Create your free account

</p>

<form id="registerForm">

<!-- Name -->

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

<input
type="text"
id="fullname"
class="form-control"
placeholder="Enter your full name"
required>

</div>

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-envelope-fill"></i>

</span>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

</div>

<!-- Mobile -->

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-phone-fill"></i>

</span>

<input
type="tel"
id="mobile"
class="form-control"
placeholder="Enter mobile number"
required>

</div>

</div>
<!-- Password -->

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Create Password"
required>

<span
class="input-group-text toggle-password"
data-target="password">

<i class="bi bi-eye-fill"></i>

</span>

</div>

</div>

<!-- Confirm Password -->

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-shield-lock-fill"></i>

</span>

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password"
required>

<span
class="input-group-text toggle-password"
data-target="confirmPassword">

<i class="bi bi-eye-fill"></i>

</span>

</div>

</div>

<!-- Terms -->

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
id="terms"
required>

<label
class="form-check-label text-white"
for="terms">

I agree to the

<a
href="#"
class="text-warning text-decoration-none">

Terms & Conditions

</a>

</label>

</div>

<!-- Register Button -->

<div class="d-grid mb-3">

<button
type="submit"
id="registerBtn"
class="btn btn-primary btn-lg">

<i class="bi bi-person-plus-fill"></i>

&nbsp;

Create Account

</button>

</div>

<div class="text-center text-white mb-3">

OR

</div>

<div class="d-grid gap-3">

<button
type="button"
class="btn btn-light google-btn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
width="20">

&nbsp;&nbsp;

Sign up with Google

</button>

<button
type="button"
class="btn btn-dark microsoft-btn">

<i class="bi bi-microsoft"></i>

&nbsp;&nbsp;

Sign up with Microsoft

</button>

</div>

<hr class="my-4 text-white">

<div class="text-center text-white">

Already have an account?

<a
href="login.html"
class="text-warning text-decoration-none fw-bold">

Login

</a>

</div>

<div class="text-center mt-4">

<a
href="index.html"
class="text-white text-decoration-none">

<i class="bi bi-arrow-left-circle"></i>

&nbsp;

Back to Home

</a>

</div>

</form>

</div>

<div class="text-center text-white mt-4">

© 2026

<strong>

Arvind Digital Hub

</strong>

<br>

Knowledge • Tools • Learning • Resources

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script s<script type="module" src="assets/js/register.js"></script>
</body>

</html>
