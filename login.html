<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Arvind Digital Hub</title>

<link rel="icon" href="assets/images/favicon.png">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2563eb,#1e3a8a,#0f172a);
overflow:hidden;

}

/* Animated Background */

body::before{

content:"";
position:absolute;
width:650px;
height:650px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-220px;
left:-180px;

}

body::after{

content:"";
position:absolute;
width:520px;
height:520px;
background:rgba(255,255,255,.05);
border-radius:50%;
bottom:-180px;
right:-160px;

}

.login-wrapper{

width:100%;
max-width:440px;
padding:20px;
position:relative;
z-index:2;

}

.login-card{

background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.18);
border-radius:24px;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.logo{

width:90px;
height:90px;
margin:auto;
display:block;
margin-bottom:20px;

}

.brand{

text-align:center;
color:#fff;
font-size:30px;
font-weight:700;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#e5e7eb;
font-size:14px;
margin-bottom:35px;

}

.form-label{

color:#fff;
font-weight:500;

}

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:rgba(255,255,255,.15);
border:none;
color:#fff;

}

.form-control{

background:rgba(255,255,255,.15);
border:none;
color:#fff;
padding:14px;

}

.form-control::placeholder{

color:#d1d5db;

}

.form-control:focus{

background:rgba(255,255,255,.18);
color:#fff;
box-shadow:none;

}

.toggle-password{

cursor:pointer;

}
/*==================================================
LOGIN PAGE CSS
PART 3/4
==================================================*/

/* INPUT ICON */

.input-group-text:last-child{

cursor:pointer;
transition:.3s;

}

.input-group-text:last-child:hover{

background:rgba(255,255,255,.25);

}

/* BUTTON */

.btn-primary{

background:#2563eb;
border:none;
border-radius:12px;
padding:14px;
font-weight:600;
transition:.35s;

}

.btn-primary:hover{

background:#1d4ed8;
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(37,99,235,.35);

}

.btn-light,
.btn-dark{

padding:13px;
border-radius:12px;
font-weight:500;
transition:.3s;

}

.btn-light:hover,
.btn-dark:hover{

transform:translateY(-2px);

}

/* LINKS */

a{

transition:.3s;

}

a:hover{

opacity:.85;

}

/* LOGIN CARD ANIMATION */

.login-card{

animation:fadeUp .8s ease;

}

@keyframes fadeUp{

0%{

opacity:0;
transform:translateY(40px);

}

100%{

opacity:1;
transform:translateY(0);

}

}

/* LOGO */

.logo{

transition:.5s;

}

.logo:hover{

transform:rotate(8deg) scale(1.08);

}

/* INPUT */

.form-control{

border-radius:0;

}

.form-control:focus{

border:none;

}

/* LOADING BUTTON */

.btn-loading{

pointer-events:none;
opacity:.85;

}

/* FOOTER */

.text-center{

line-height:1.7;

}

/* MOBILE */

@media(max-width:768px){

.login-wrapper{

padding:15px;

}

.login-card{

padding:28px;

}

.brand{

font-size:26px;

}

.subtitle{

font-size:13px;

}

.logo{

width:75px;
height:75px;

}

}

/* SMALL MOBILE */

@media(max-width:480px){

.login-card{

padding:22px;

}

.brand{

font-size:22px;

}

.form-control{

padding:12px;

}

.btn{

padding:12px;

}

}

/* LARGE SCREEN */

@media(min-width:1200px){

.login-wrapper{

max-width:470px;

}

}

/* DARK MODE READY */

body.dark{

background:#0f172a;

}

body.dark .login-card{

background:rgba(17,24,39,.75);

}

/* ERROR */

.error{

border:1px solid #ef4444 !important;

}

/* SUCCESS */

.success{

border:1px solid #22c55e !important;

}





</style>

</head>

<body>

<div class="login-wrapper">

<div class="login-card">

<img src="assets/images/logo.png" class="logo" alt="Logo">

<h2 class="brand">
Arvind Digital Hub
</h2>

<p class="subtitle">
Knowledge • Tools • Learning • Resources
</p>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">
Email or Mobile
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input
type="text"
id="username"
class="form-control"
placeholder="Enter Email or Mobile"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<span class="input-group-text toggle-password">

<i class="bi bi-eye-fill" id="eyeIcon"></i>

</span>

</div>

</div>
<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
id="rememberMe">

<label
class="form-check-label text-white"
for="rememberMe">

Remember Me

</label>

</div>

<a
href="#"
class="text-warning text-decoration-none">

Forgot Password?

</a>

<a
href="register.html"
class="text-warning text-decoration-none">

Register User

</a>

</div>

<div class="d-grid mb-3">

<button
type="submit"
id="loginBtn"
class="btn btn-primary btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

&nbsp; Login

</button>

</div>

<div class="text-center text-white mb-3">

OR

</div>

<div class="d-grid gap-3">

<button
type="button"
class="btn btn-light">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
width="20">

&nbsp;&nbsp;

Continue with Google

</button>

<button
type="button"
class="btn btn-dark">

<i class="bi bi-microsoft"></i>

&nbsp;&nbsp;

Continue with Microsoft

</button>

</div>

<hr class="my-4 text-white">

<div class="text-center text-white">

Don't have an account?

<a
href="register.html"
class="text-warning text-decoration-none fw-bold">

Create Account

</a>

</div>

<div class="text-center mt-4">

<a
href="index.html"
class="text-white text-decoration-none">

<i class="bi bi-arrow-left-circle"></i>

&nbsp;

Back to Home

</a>

</div>

</form>

</div>

<div class="text-center text-white mt-4">

© 2026

<strong>

Arvind Digital Hub

</strong>

<br>

Knowledge • Tools • Learning • Resources

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="assets/js/login.js"></script>

</body>

</html>
