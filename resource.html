<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Resource Details | Arvind Digital Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f4f6fb;
}

.resource-card{
    max-width:850px;
    margin:50px auto;
    border-radius:18px;
}

.info-title{
    font-weight:600;
    color:#666;
}

.info-value{
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow resource-card">

<div class="card-body p-4">

<a href="dashboard.html"
class="btn btn-outline-secondary mb-4">

<i class="bi bi-arrow-left"></i>

Back to Dashboard

</a>

<h2 id="resourceTitle">

Loading...

</h2>

<span
id="resourceCategory"
class="badge bg-primary mb-3">

Loading...

</span>

<p
id="resourceDescription"
class="text-muted">

Loading...

</p>

<hr>

<div class="row gy-3">

<div class="col-md-6">

<div class="info-title">

<i class="bi bi-calendar3"></i>

Upload Date

</div>

<div
id="resourceDate"
class="info-value">

Loading...

</div>

</div>

<div class="col-md-6">

<div class="info-title">

<i class="bi bi-box-seam"></i>

File Size

</div>

<div
id="resourceSize"
class="info-value">

Loading...

</div>

</div>

<div class="col-md-6">

<div class="info-title">

<i class="bi bi-download"></i>

Downloads

</div>

<div
id="resourceDownloads"
class="info-value">

0

</div>

</div>

<div class="col-md-6">

<div class="info-title">

<i class="bi bi-person-circle"></i>

Uploaded By

</div>

<div
id="resourceUploader"
class="info-value">

Admin

</div>

</div>

</div>

<div class="text-center mt-5">

<a
id="downloadBtn"
href="#"
class="btn btn-primary btn-lg">

<i class="bi bi-download me-2"></i>

Download Resource

</a>

</div>

</div>

</div>

</div>

<script type="module" src="assets/js/resource.js"></script>

</body>

</html>
