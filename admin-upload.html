<script type="module">

import { db } from "./assets/js/firebase.js";
import { supabase } from "./assets/js/supabase.js";

import {
  collection,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy,
  getDocs,
  where,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const form = document.getElementById("uploadForm");
const submitBtn = document.getElementById("submitBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const statusMsg = document.getElementById("statusMsg");
const fileList = document.getElementById("fileList");

/*====================================
COMMON FILE UPLOAD FUNCTION
====================================*/


async function uploadSingleFile(title, description, category, file) {

    const storagePath =
    `${category}/${Date.now()}_${file.name}`;

    const { error } =
    await supabase.storage
    .from("resources")
    .upload(storagePath, file);

    if (error) throw error;

    const { data } =
    supabase.storage
    .from("resources")
    .getPublicUrl(storagePath);

    const fileURL = data.publicUrl;

    const docRef = await addDoc(
        collection(db, "resources"),
        {

            title,

            description,

            category,

            fileURL,

            storagePath,

            fileType: file.type,

            size: file.size,

            downloads: 0,

            uploadedAt: serverTimestamp()

        }
    );

    await addDoc(
        collection(db, "notifications"),
        {

            title: `New ${category} Uploaded`,

            message: title,

            resourceId: docRef.id,

            category,

            createdAt: serverTimestamp(),

            active: true

        }
    );

    await addDoc(
        collection(db, "userNotifications"),
        {

            resourceId: docRef.id,

            createdAt: serverTimestamp(),

            readBy: []

        }
    );

}
/*====================================
BULK UPLOAD
====================================*/

const bulkCategory =
    document.getElementById("bulkCategory");

const bulkDescription =
    document.getElementById("bulkDescription");

const bulkFiles =
    document.getElementById("bulkFiles");

const bulkFileInfo =
    document.getElementById("bulkFileInfo");

const bulkUploadBtn =
    document.getElementById("bulkUploadBtn");

const bulkClearBtn =
    document.getElementById("bulkClearBtn");

const bulkProgressWrap =
    document.getElementById("bulkProgressWrap");

const bulkProgressBar =
    document.getElementById("bulkProgressBar");

const bulkProgressText =
    document.getElementById("bulkProgressText");

const bulkStatusMsg =
    document.getElementById("bulkStatusMsg");


/*====================================
SHOW SELECTED FILES
====================================*/

bulkFiles.addEventListener("change", () => {

    const files = Array.from(bulkFiles.files);

    if (files.length === 0) {

        bulkFileInfo.textContent =
            "No files selected.";

        bulkUploadBtn.disabled = true;

        return;

    }

    let totalSize = 0;

    files.forEach(file => {

        totalSize += file.size;

    });

    const totalMB =
        (totalSize / (1024 * 1024)).toFixed(2);

    bulkFileInfo.innerHTML =
        `<strong>${files.length}</strong> file(s) selected
         &nbsp; | &nbsp;
         Total size: <strong>${totalMB} MB</strong>`;

    bulkUploadBtn.disabled = false;

});


/*====================================
CLEAR BULK SELECTION
====================================*/

bulkClearBtn.addEventListener("click", () => {

    bulkFiles.value = "";

    bulkFileInfo.textContent =
        "No files selected.";

    bulkUploadBtn.disabled = true;

    bulkProgressWrap.style.display =
        "none";

    bulkProgressBar.style.width =
        "0%";

    bulkProgressBar.textContent =
        "0%";

    bulkProgressText.textContent =
        "Preparing upload...";

    bulkStatusMsg.innerHTML = "";

});
form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const title = document.getElementById("title").value.trim();

    const description = document.getElementById("description").value.trim();

    const category = document.getElementById("category").value;

    const file = document.getElementById("fileInput").files[0];

    if (!file) {

        alert("Please choose a file.");

        return;

    }

    submitBtn.disabled = true;

    statusMsg.innerHTML = "";

    progressWrap.style.display = "block";

    progressBar.style.width = "10%";

    progressBar.textContent = "Uploading...";
try {

    await uploadSingleFile(
        title,
        description,
        category,
        file
    );

    progressBar.style.width = "100%";
    progressBar.textContent = "100%";

    statusMsg.innerHTML =
    `<div class="alert alert-success">
        File uploaded successfully.
    </div>`;

    form.reset();

    loadFiles();

}

catch (error) {

    statusMsg.innerHTML =
    `<div class="alert alert-danger">
        ${error.message}
    </div>`;

}

/* PUT THESE TWO LINES HERE */

progressWrap.style.display = "none";

submitBtn.disabled = false;

});
	/*====================================
CREATE USER NOTIFICATION
====================================*/

await addDoc(
    collection(db, "userNotifications"),
    {

        resourceId: docRef.id,

        createdAt: serverTimestamp(),

        readBy: []

    }
);
    progressBar.style.width = "100%";

    progressBar.textContent = "100%";

    statusMsg.innerHTML =
    `<div class="alert alert-success">
        File uploaded successfully.
    </div>`;

    form.reset();

    progressWrap.style.display = "none";

    submitBtn.disabled = false;

    loadFiles();

});
async function loadFiles() {

    fileList.innerHTML =
    `<div class="text-muted text-center py-3">
        Loading...
    </div>`;

    const q = query(
        collection(db, "resources"),
        orderBy("uploadedAt", "desc")
    );

    const snap = await getDocs(q);

    if (snap.empty) {

        fileList.innerHTML =
        `<div class="text-muted text-center py-3">
            No files uploaded yet.
        </div>`;

        return;

    }

    fileList.innerHTML = "";

    snap.forEach((docSnap) => {

        const item = docSnap.data();

        const row = document.createElement("div");

        row.className =
        "list-group-item d-flex justify-content-between align-items-center file-row";

        row.innerHTML = `

        <div>

            <strong>${item.title}</strong>

            <br>

            <small class="text-muted">

                ${item.description}

            </small>

            <br>

            <span class="badge bg-secondary">

                ${item.category}

            </span>

        </div>

        <div>

            <a
            href="${item.fileURL}"
            target="_blank"
            class="btn btn-sm btn-outline-primary me-2">

            View

            </a>

            <button
            class="btn btn-sm btn-outline-danger btn-delete">

            Delete

            </button>

        </div>

        `;

        const deleteBtn =
        row.querySelector(".btn-delete");

        deleteBtn.addEventListener(
            "click",
            async () => {
			                if (!confirm(`Delete "${item.title}"?`)) {

                    return;

                }

                try {

					console.log("Deleting Storage Path:", item.storagePath);

                    const { error } =
                    await supabase.storage
                    .from("resources")
                    .remove([item.storagePath]);
					console.log("Supabase delete error:", error);

                    if (error) {

                        console.warn(
                            "Storage delete error:",
                            error.message
                        );

                    }

                } catch (err) {

                    console.warn(err);

                }

              /*====================================
DELETE RELATED S
====================================*/

console.log("Resource document ID:", docSnap.id);

const notificationQuery = query(
    collection(db, "notifications"),
    where("resourceId", "==", docSnap.id)
);

const notificationSnap = await getDocs(notificationQuery);

console.log("Notifications found:", notificationSnap.size);

for (const notificationDoc of notificationSnap.docs) {

    console.log("Deleting notification:", notificationDoc.id);

    await deleteDoc(
        doc(db, "notifications", notificationDoc.id)
    );

}

/*====================================
DELETE RESOURCE
====================================*/

await deleteDoc(

    doc(
        db,
        "resources",
        docSnap.id
    )

);

                statusMsg.innerHTML =
                `<div class="alert alert-success">
                    File deleted successfully.
                </div>`;

                loadFiles();

            }

        );

        fileList.appendChild(row);

    });

}
loadFiles();

/*====================================
BULK FILE SELECT
====================================*/

const bulkFiles =
document.getElementById("bulkFiles");

const bulkCount =
document.getElementById("bulkCount");

const bulkFileList =
document.getElementById("bulkFileList");

const bulkUploadBtn =
document.getElementById("bulkUploadBtn");
const bulkCategory =
document.getElementById("bulkCategory");	

bulkFiles.addEventListener(
    "change",
    () => {

        bulkFileList.innerHTML = "";

        bulkCount.textContent =
        bulkFiles.files.length;

        if (bulkFiles.files.length === 0) {

            bulkUploadBtn.disabled = true;

            return;

        }

        bulkUploadBtn.disabled = false;

        [...bulkFiles.files].forEach(file => {

            bulkFileList.innerHTML += `

<div class="list-group-item d-flex justify-content-between">

<span>${file.name}</span>

<span class="text-muted">

${formatFileSize(file.size)}

</span>

</div>

`;

        });

    }
);
	/*====================================
BULK UPLOAD TO SUPABASE
====================================*/

bulkUploadBtn.addEventListener(
    "click",
    async () => {

        if (bulkFiles.files.length === 0) {

            alert("Please select files.");

            return;

        }

        bulkUploadBtn.disabled = true;

        statusMsg.innerHTML =
        `<div class="alert alert-info">
            Uploading files...
        </div>`;

        for (const file of bulkFiles.files) {

            const fileName =
            `${Date.now()}_${file.name}`;

            const storagePath =
            `${bulkCategory.value}/${fileName}`;

            const { error } =
            await supabase.storage
            .from("resources")
            .upload(
                storagePath,
                file
            );

            if (error) {

                console.error(error);

            } else {

                console.log(
                    "Uploaded:",
                    storagePath
                );

            }

        }

        statusMsg.innerHTML =
        `<div class="alert alert-success">
            Files uploaded successfully to Supabase.
        </div>`;

        bulkUploadBtn.disabled = false;

    }
);
	
</script>
