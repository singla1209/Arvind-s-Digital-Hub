<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Upload | Arvind Digital Hub</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Auth guard: only the admin UID may view this page -->
<script type="module">
import { auth } from "./assets/js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

// TODO: replace with your real UID (Firebase Console > Authentication > Users)
const ADMIN_UID = "dnC5ocJgS4aeNgMqFm7W9d3RaM32";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  if (user.uid !== ADMIN_UID) {
    window.location.href = "dashboard.html";
  }
});
</script>

<style>
body { background:#f4f6fb; }
.upload-card { max-width: 640px; margin: 60px auto; }
#progressWrap { display:none; }
.file-row:hover { background:#f8f9fa; }
</style>

</head>
<body>

<div class="container">

<div class="card shadow-sm upload-card">
<div class="card-body p-4">

<h4 class="fw-bold mb-4"><i class="bi bi-cloud-upload-fill text-primary me-2"></i>Upload a File</h4>

<form id="uploadForm">

  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" class="form-control" id="title" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" id="description" rows="2" required></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select class="form-select" id="category" required>
      <option>Excel</option>
      <option>Python</option>
      <option>Documents</option>
      <option>Image</option>
      <option>Video</option>
      <option>Other</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">File</label>
    <input type="file" class="form-control" id="fileInput" required>
  </div>

  <div id="progressWrap" class="mb-3">
    <div class="progress">
      <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
    </div>
  </div>

  <div id="statusMsg" class="mb-3"></div>

  <button type="submit" class="btn btn-primary w-100" id="submitBtn">
    <i class="bi bi-upload me-1"></i> Upload
  </button>

</form>

</div>
</div>

<div class="card shadow-sm upload-card">
<div class="card-body p-4">

<h5 class="fw-bold mb-3">Existing Files</h5>
<div id="fileList" class="list-group">
  <div class="text-muted text-center py-3">Loading...</div>
</div>

</div>
</div>

</div>

<script type="module">
import { db, storage } from "./assets/js/firebase.js";
import {
  collection, addDoc, deleteDoc, doc,
  serverTimestamp, query, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import {
  ref, uploadBytesResumable, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";

const form = document.getElementById("uploadForm");
const submitBtn = document.getElementById("submitBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const statusMsg = document.getElementById("statusMsg");
const fileList = document.getElementById("fileList");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const category = document.getElementById("category").value;
  const file = document.getElementById("fileInput").files[0];

  if (!file) return;

  submitBtn.disabled = true;
  statusMsg.innerHTML = "";
  progressWrap.style.display = "block";

  const storagePath = `resources/${category}/${Date.now()}_${file.name}`;
  const storageRef = ref(storage, storagePath);
  const uploadTask = uploadBytesResumable(storageRef, file);

  uploadTask.on(
    "state_changed",
    (snapshot) => {
      const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
      progressBar.style.width = pct + "%";
      progressBar.textContent = pct + "%";
    },
    (error) => {
      statusMsg.innerHTML = `<div class="alert alert-danger">Upload failed: ${error.message}</div>`;
      submitBtn.disabled = false;
    },
    async () => {
      const fileURL = await getDownloadURL(uploadTask.snapshot.ref);

      await addDoc(collection(db, "resources"), {
        title,
        description,
        category,
        fileURL,
        storagePath,
        fileType: file.type,
        size: file.size,
        uploadedAt: serverTimestamp()
      });

      statusMsg.innerHTML = `<div class="alert alert-success">Uploaded successfully.</div>`;
      form.reset();
      progressWrap.style.display = "none";
      submitBtn.disabled = false;
      loadFiles();
    }
  );
});

async function loadFiles() {
  fileList.innerHTML = `<div class="text-muted text-center py-3">Loading...</div>`;

  const q = query(collection(db, "resources"), orderBy("uploadedAt", "desc"));
  const snap = await getDocs(q);

  if (snap.empty) {
    fileList.innerHTML = `<div class="text-muted text-center py-3">No files yet.</div>`;
    return;
  }

  fileList.innerHTML = "";

  snap.forEach((docSnap) => {
    const item = docSnap.data();

    const row = document.createElement("div");
    row.className = "list-group-item d-flex justify-content-between align-items-center file-row";
    row.innerHTML = `
      <div>
        <strong>${item.title}</strong>
        <span class="badge bg-light text-dark ms-2">${item.category}</span>
      </div>
      <div>
        <a href="${item.fileURL}" target="_blank" class="btn btn-sm btn-outline-primary me-2">View</a>
        <button class="btn btn-sm btn-outline-danger btn-delete">Delete</button>
      </div>
    `;

    row.querySelector(".btn-delete").addEventListener("click", async () => {
      if (!confirm(`Delete "${item.title}"?`)) return;

      try {
        await deleteObject(ref(storage, item.storagePath));
      } catch (err) {
        console.warn("Storage file already missing or failed to delete:", err.message);
      }

      await deleteDoc(doc(db, "resources", docSnap.id));
      loadFiles();
    });

    fileList.appendChild(row);
  });
}

loadFiles();
</script>

</body>
</html>
