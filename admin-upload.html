<body>

	<div class="mb-3">

    <label class="form-label">Category</label>

    <select
        id="bulkCategory"
        class="form-select">

        <option value="Excel">Excel</option>

        <option value="Python">Python</option>

</div>

    </div>
</div>

</div>

<button
    type="button"
    id="bulkUploadBtn"
    class="btn btn-success"
    disabled>

    Upload All Files

</button>

</div>

<div class="card shadow-sm upload-card">

<div class="card-body p-4">

<h5 class="fw-bold mb-3">
Existing Files
</h5>

<div
id="fileList"
class="list-group">

<div class="text-muted text-center py-3">
Loading...
</div>

</div>

</div>

</div>

<script type="module">

import { db } from "./assets/js/firebase.js";
import { supabase } from "./assets/js/supabase.js";

import {
  collection,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy,
  getDocs,
  where,
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const form = document.getElementById("uploadForm");
const submitBtn = document.getElementById("submitBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const statusMsg = document.getElementById("statusMsg");
const fileList = document.getElementById("fileList");

/*====================================
COMMON FILE UPLOAD FUNCTION
====================================*/

async function uploadSingleFile(
    title,
    description,
    category,
    file
) {

    // We will move the upload code here

	const fileName =
`${Date.now()}_${file.name}`;

const storagePath =
`${category}/${fileName}`;

const { error } =
await supabase.storage
.from("resources")
.upload(
    storagePath,
    file
);

if (error) {

    throw error;

}
	const { data } =
    supabase.storage
    .from("resources")
    .getPublicUrl(storagePath);

const fileURL = data.publicUrl;

const docRef = await addDoc(
    collection(db, "resources"),
    {

        title,

        description,

        category,

        fileURL,

        storagePath,

        fileType: file.type,

        size: file.size,

        downloads: 0,

        uploadedAt: serverTimestamp()

    }
);
}

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const title = document.getElementById("title").value.trim();

    const description = document.getElementById("description").value.trim();

    const category = document.getElementById("category").value;

    const file = document.getElementById("fileInput").files[0];

    if (!file) {

        alert("Please choose a file.");

        return;

    }

    submitBtn.disabled = true;

    statusMsg.innerHTML = "";

    progressWrap.style.display = "block";

    progressBar.style.width = "10%";

    progressBar.textContent = "Uploading...";

    const storagePath =
        `${category}/${Date.now()}_${file.name}`;

    const { error } =
        await supabase.storage
        .from("resources")
        .upload(storagePath, file);

    if (error) {

        statusMsg.innerHTML =
        `<div class="alert alert-danger">
            ${error.message}
        </div>`;

        progressWrap.style.display = "none";

        submitBtn.disabled = false;

        return;

    }

    progressBar.style.width = "80%";

    const { data } =
        supabase.storage
        .from("resources")
        .getPublicUrl(storagePath);

    const fileURL = data.publicUrl;

   const docRef = await addDoc(
    collection(db, "resources"),
    {

        title,

        description,

        category,

        fileURL,

        storagePath,

        fileType: file.type,

        size: file.size,

        downloads: 0,

        uploadedAt: serverTimestamp()

    }
);

// Create notification automatically

await addDoc(
    collection(db, "notifications"),
    {

        title: `New ${category} Uploaded`,

        message: title,

        resourceId: docRef.id,

        category: category,

        createdAt: serverTimestamp(),

        active: true

    }
);


	/*====================================
CREATE USER NOTIFICATION
====================================*/

await addDoc(
    collection(db, "userNotifications"),
    {

        resourceId: docRef.id,

        createdAt: serverTimestamp(),

        readBy: []

    }
);
    progressBar.style.width = "100%";

    progressBar.textContent = "100%";

    statusMsg.innerHTML =
    `<div class="alert alert-success">
        File uploaded successfully.
    </div>`;

    form.reset();

    progressWrap.style.display = "none";

    submitBtn.disabled = false;

    loadFiles();

});
async function loadFiles() {

    fileList.innerHTML =
    `<div class="text-muted text-center py-3">
        Loading...
    </div>`;

    const q = query(
        collection(db, "resources"),
        orderBy("uploadedAt", "desc")
    );

    const snap = await getDocs(q);

    if (snap.empty) {

        fileList.innerHTML =
        `<div class="text-muted text-center py-3">
            No files uploaded yet.
        </div>`;

        return;

    }

    fileList.innerHTML = "";

    snap.forEach((docSnap) => {

        const item = docSnap.data();

        const row = document.createElement("div");

        row.className =
        "list-group-item d-flex justify-content-between align-items-center file-row";

        row.innerHTML = `

        <div>

            <strong>${item.title}</strong>

            <br>

            <small class="text-muted">

                ${item.description}

            </small>

            <br>

            <span class="badge bg-secondary">

                ${item.category}

            </span>

        </div>

        <div>

            <a
            href="${item.fileURL}"
            target="_blank"
            class="btn btn-sm btn-outline-primary me-2">

            View

            </a>

            <button
            class="btn btn-sm btn-outline-danger btn-delete">

            Delete

            </button>

        </div>

        `;

        const deleteBtn =
        row.querySelector(".btn-delete");

        deleteBtn.addEventListener(
            "click",
            async () => {
			                if (!confirm(`Delete "${item.title}"?`)) {

                    return;

                }

                try {

					console.log("Deleting Storage Path:", item.storagePath);

                    const { error } =
                    await supabase.storage
                    .from("resources")
                    .remove([item.storagePath]);
					console.log("Supabase delete error:", error);

                    if (error) {

                        console.warn(
                            "Storage delete error:",
                            error.message
                        );

                    }

                } catch (err) {

                    console.warn(err);

                }

              /*====================================
DELETE RELATED S
====================================*/

console.log("Resource document ID:", docSnap.id);

const notificationQuery = query(
    collection(db, "notifications"),
    where("resourceId", "==", docSnap.id)
);

const notificationSnap = await getDocs(notificationQuery);

console.log("Notifications found:", notificationSnap.size);

for (const notificationDoc of notificationSnap.docs) {

    console.log("Deleting notification:", notificationDoc.id);

    await deleteDoc(
        doc(db, "notifications", notificationDoc.id)
    );

}

/*====================================
DELETE RESOURCE
====================================*/

await deleteDoc(

    doc(
        db,
        "resources",
        docSnap.id
    )

);

                statusMsg.innerHTML =
                `<div class="alert alert-success">
                    File deleted successfully.
                </div>`;

                loadFiles();

            }

        );

        fileList.appendChild(row);

    });

}
loadFiles();

/*====================================
BULK FILE SELECT
====================================*/

const bulkFiles =
document.getElementById("bulkFiles");

const bulkCount =
document.getElementById("bulkCount");

const bulkFileList =
document.getElementById("bulkFileList");

const bulkUploadBtn =
document.getElementById("bulkUploadBtn");
const bulkCategory =
document.getElementById("bulkCategory");	

bulkFiles.addEventListener(
    "change",
    () => {

        bulkFileList.innerHTML = "";

        bulkCount.textContent =
        bulkFiles.files.length;

        if (bulkFiles.files.length === 0) {

            bulkUploadBtn.disabled = true;

            return;

        }

        bulkUploadBtn.disabled = false;

        [...bulkFiles.files].forEach(file => {

            bulkFileList.innerHTML += `

<div class="list-group-item d-flex justify-content-between">

<span>${file.name}</span>

<span class="text-muted">

${formatFileSize(file.size)}

</span>

</div>

`;

        });

    }
);
	/*====================================
BULK UPLOAD
Same Firebase flow as Single Upload
====================================*/

bulkUploadBtn.addEventListener(
    "click",
    async () => {

        if (bulkFiles.files.length === 0) {
            alert("Please select files.");
            return;
        }

        bulkUploadBtn.disabled = true;

        statusMsg.innerHTML =
            `<div class="alert alert-info">
                Uploading files...
            </div>`;

        let uploadedCount = 0;
        let failedCount = 0;

        try {

            for (const file of bulkFiles.files) {

                try {

                    /* 1. Upload to Supabase */

                    const fileName =
                        `${Date.now()}_${file.name}`;

                    const category =
                        bulkCategory.value;

                    const storagePath =
                        `${category}/${fileName}`;

                    const { error } =
                        await supabase.storage
                            .from("resources")
                            .upload(
                                storagePath,
                                file
                            );

                    if (error) {
                        throw error;
                    }


                    /* 2. Get public URL */

                    const { data } =
                        supabase.storage
                            .from("resources")
                            .getPublicUrl(storagePath);

                    const fileURL = data.publicUrl;


                    /* 3. Create Firebase resource */

                    const title = file.name;

                    const description =
                        `Bulk uploaded file: ${file.name}`;

                    const docRef = await addDoc(
                        collection(db, "resources"),
                        {
                            title: title,
                            description: description,
                            category: category,
                            fileURL: fileURL,
                            storagePath: storagePath,
                            fileType: file.type,
                            size: file.size,
                            downloads: 0,
                            uploadedAt: serverTimestamp()
                        }
                    );


                    /* 4. Create notification */

                    await addDoc(
                        collection(db, "notifications"),
                        {
                            title: `New ${category} Uploaded`,
                            message: title,
                            resourceId: docRef.id,
                            category: category,
                            createdAt: serverTimestamp(),
                            active: true
                        }
                    );


                    /* 5. Create user notification */

                    await addDoc(
                        collection(db, "userNotifications"),
                        {
                            resourceId: docRef.id,
                            createdAt: serverTimestamp(),
                            readBy: []
                        }
                    );

                    uploadedCount++;

                }
                catch (fileError) {

                    failedCount++;

                    console.error(
                        "Bulk upload failed for:",
                        file.name,
                        fileError
                    );

                }

            }


            /* Final result */

            if (failedCount === 0) {

                statusMsg.innerHTML =
                    `<div class="alert alert-success">
                        ${uploadedCount} file(s) uploaded successfully.
                    </div>`;

            }
            else if (uploadedCount > 0) {

                statusMsg.innerHTML =
                    `<div class="alert alert-warning">
                        ${uploadedCount} file(s) uploaded successfully.
                        ${failedCount} file(s) failed.
                        Check the console for details.
                    </div>`;

            }
            else {

                statusMsg.innerHTML =
                    `<div class="alert alert-danger">
                        Bulk upload failed.
                        Check the console for details.
                    </div>`;

            }


            /* Reset bulk selection */

            bulkFiles.value = "";
            bulkFileList.innerHTML = "";
            bulkCount.textContent = "0";
            bulkUploadBtn.disabled = true;


            /* Refresh existing files */

            await loadFiles();

        }
        catch (error) {

            console.error(
                "Bulk Upload Error:",
                error
            );

            statusMsg.innerHTML =
                `<div class="alert alert-danger">
                    ${error?.message ||
                    "Bulk upload failed."}
                </div>`;

        }
        finally {

            bulkUploadBtn.disabled = false;

        }

    }
);

</script>

</body>
